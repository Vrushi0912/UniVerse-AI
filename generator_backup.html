<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Generator - UniVerse AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">🌌</span>
                <span class="logo-text">UniVerse AI</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="chat.html">Chat AI</a></li>
                <li><a href="generator.html" class="active">Educational</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="docs.html">Documentation</a></li>
            </ul>
        </div>
    </nav>

    <div class="generator-container">
        <div class="generator-header">
            <h1>Generate Educational Content</h1>
            <p>Enter any topic to create structured learning materials</p>
        </div>

        <div class="input-section">
            <textarea id="topicInput" placeholder="Enter your topic (e.g., binary search, photosynthesis)..." rows="3"></textarea>
            <button class="generate-btn" id="generateBtn" onclick="generateContent()">Generate Content</button>
        </div>

        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <p>Generating content...</p>
        </div>

        <div id="resultsSection" class="results-section hidden">
            <div class="result-card full-width">
                <h2><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"></path><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v16H6.5A2.5 2.5 0 0 1 4 17.5v-11z"></path></svg> Content</h2>
                <div id="contentDisplay"></div>
            </div>

            <div class="result-card">
                <h2><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20v-6"></path><path d="M8 20v-10"></path><path d="M16 20v-4"></path><rect x="3" y="3" width="18" height="4" rx="1"></rect></svg> Visual Diagram</h2>
                <button class="download-btn" id="downloadDiagramBtn" onclick="downloadDiagram()" style="display:none;">Download Visual</button>
                <div id="diagramDisplay"></div>
            </div>

            <div class="result-card">
                <h2><svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v11"></path><path d="M8 5v7"></path><path d="M16 5v7"></path><rect x="3" y="11" width="18" height="10" rx="2"></rect></svg> Audio Explanation</h2>
                <button class="audio-btn" id="playAudioBtn" onclick="playAudio()">Play</button>
                <div id="audioTranscript"></div>
            </div>
        </div>
    </div>

    <script>
        const KEY = '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';
        let audio = '';

        async function callAI(p) {
            const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'meta-llama/llama-3.2-3b-instruct:free', messages: [{ role: 'user', content: p }] })
            });
            return (await r.json()).choices[0].message.content;
        }

        async function generateContent() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) return alert('Enter a topic');

            showLoading();
            try {
                let content, script;
                try {
                    content = await callAI(`Explain "${topic}" SHORT and SIMPLE:\n\n## What is it?\n[1-2 sentences]\n\n## Key Points\n- Point 1\n- Point 2\n- Point 3\n\n## Why it matters\n[1 sentence]\n\n## Example\n[1 example]`);
                    script = await callAI(`Explain "${topic}" to students in 70 words. Start: "Hello! Let's learn..." Simple.`);
                } catch {
                    content = `## What is it?\n${topic} organizes information systematically.\n\n## Key Points\n- Breaks complex ideas down\n- Follows specific patterns\n- Enables advanced understanding\n\n## Why it matters\nProvides problem-solving tools.\n\n## Example\nLike organizing a library.`;
                    script = `Hello! Let's learn about ${topic}. This helps us understand key concepts efficiently.`;
                }

                display(content, script);
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                hideLoading();
            }
        }

        async function display(content, script) {
            // Content
            let html = '';
            content.split('\n').forEach(l => {
                l = l.trim();
                if (l.startsWith('##')) html += `<h3>${l.substring(3)}</h3>`;
                else if (l.startsWith('-')) {
                    if (!html.endsWith('</ul>')) html += '<ul>';
                    html += `<li>${l.substring(2)}</li>`;
                } else if (l && html.endsWith('</li>')) {
                    html += '</ul><p>' + l + '</p>';
                } else if (l) html += '<p>' + l + '</p>';
            });
            if (html.endsWith('</li>')) html += '</ul>';
            document.getElementById('contentDisplay').innerHTML = html;

            // Generate educational image URL (no API, no CORS)
            const topic = document.getElementById('topicInput').value.trim();
            
            // Use Lorem Picsum with seed based on topic (consistent images)
            const seed = topic.toLowerCase().replace(/\s+/g, '-');
            const imageUrl = `https://picsum.photos/seed/${seed}/800/500`;
            
            const div = document.getElementById('diagramDisplay');
            
            // Create image with loading state
            div.innerHTML = `
                <div style="position: relative; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 8px; padding: 40px; text-align: center; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="font-size: 4rem; margin-bottom: 20px;">
                        ${getTopicIcon(topic)}
                    </div>
                    <h3 style="color: white; font-size: 2rem; margin-bottom: 10px;">${topic}</h3>
                    <p style="color: rgba(255,255,255,0.9); font-size: 1.1rem;">Educational Concept Visualization</p>
                    <div style="margin-top: 20px; padding: 15px 30px; background: rgba(255,255,255,0.2); border-radius: 8px; backdrop-filter: blur(10px);">
                        <p style="color: white; font-weight: 600;">🎯 ${getTopicDescription(topic)}</p>
                    </div>
                </div>
            `;
            
            // Store for download
            window.currentImage = null; // Will be handled by screenshot
            
            // Show download button
            document.getElementById('downloadDiagramBtn').style.display = 'block';
            document.getElementById('downloadDiagramBtn').textContent = '⬇️ Download Visual';

            // Audio
            audio = script;
            document.getElementById('audioTranscript').textContent = script.substring(0, 120) + '...';
            document.getElementById('resultsSection').classList.remove('hidden');
        }

        async function downloadDiagram() {
            // Download by rendering the current diagram container to an image via canvas
            const container = document.getElementById('diagramDisplay').firstElementChild;
            if (!container) return alert('Image not ready');
            
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='600'>
                <foreignObject width='100%' height='100%'>
                    ${new XMLSerializer().serializeToString(container)}
                </foreignObject>
            </svg>`;
            
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'educational-visual.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        function getTopicIcon(topic) {
            const t = topic.toLowerCase();
            if (t.includes('stack')) return '📚';
            if (t.includes('queue')) return '📥';
            if (t.includes('tree')) return '🌳';
            if (t.includes('graph')) return '📈';
            if (t.includes('search')) return '🔎';
            if (t.includes('sort')) return '🔃';
            if (t.includes('algorithm')) return '🧠';
            if (t.includes('machine')) return '🤖';
            if (t.includes('database')) return '🗄️';
            if (t.includes('network')) return '🌐';
            return '🎓';
        }

        function getTopicDescription(topic) {
            const t = topic.toLowerCase();
            if (t.includes('stack')) return 'Last-In, First-Out structure with Push/Pop operations';
            if (t.includes('queue')) return 'First-In, First-Out processing with Enqueue/Dequeue';
            if (t.includes('tree')) return 'Hierarchical nodes: Root, Parent, Children, Leaf';
            if (t.includes('graph')) return 'Nodes and edges with relationships';
            if (t.includes('search')) return 'Find target by comparing and narrowing the range';
            if (t.includes('sort')) return 'Arrange items by comparing and swapping';
            if (t.includes('algorithm')) return 'Step-by-step method to solve a problem';
            if (t.includes('machine')) return 'Patterns learned from data to make predictions';
            if (t.includes('database')) return 'Organized storage with tables and relations';
            if (t.includes('network')) return 'Connected systems sharing information';
            return 'Core idea shown as a clean educational visual';
        }

        function playAudio() {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(audio);
            u.rate = 0.85;
            const btn = document.getElementById('playAudioBtn');
            btn.textContent = '🔊 Playing...';
            btn.disabled = true;
            u.onend = () => { btn.textContent = '▶️ Play'; btn.disabled = false; };
            speechSynthesis.speak(u);
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('resultsSection').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('generateBtn').disabled = false;
        }
    </script>
</body>
</html>
